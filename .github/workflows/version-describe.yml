name: Windows version generation

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare release tarball
        run: |
          timeout --kill-after=3s 120s sudo apt-get update
          timeout --kill-after=3s 120s sudo apt-get install -y autoconf automake libtool
          timeout --kill-after=3s 60s ./bootstrap.sh
          mkdir -p build/dist
          cd build/dist
          timeout --kill-after=3s 60s ../../configure --disable-udev --disable-man-pages
          timeout --kill-after=3s 300s make -j2 distcheck DISTCHECK_CONFIGURE_FLAGS='--disable-udev --disable-man-pages'
      - uses: actions/upload-artifact@v7
        with:
          name: version-test-tarball
          path: build/dist/libusb-*.tar.bz2
          if-no-files-found: error

  windows:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the older shell query and SourceTree's off-PATH layout.
          - name: SourceTree layout (Git 2.45.2)
            release: v2.45.2.windows.1
            asset: PortableGit-2.45.2-64-bit.7z.exe
            sha256: 851a15074dea6b272785b2a2a4697a72970256de2afe7b8e4a9c5e168c27ccdd
            test_option: --sourcetree
          - name: MinGit (no bash or cygpath)
            release: v2.56.0.windows.4
            asset: MinGit-2.56.0.4-64-bit.zip
            sha256: e3bf78351fe777fba47ddee5950082f8a98bb0f02604fdc7ba3ee2cb68ffa877
            test_option: --mingit
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: version-test-tarball
          path: build/packages
      - name: Prepare isolated Git distribution
        shell: pwsh
        env:
          GIT_RELEASE: ${{ matrix.release }}
          GIT_ASSET: ${{ matrix.asset }}
          GIT_SHA256: ${{ matrix.sha256 }}
        run: |
          $root = Join-Path $PWD 'build/tool profile/Atlassian/SourceTree/git_local'
          New-Item -ItemType Directory -Force $root | Out-Null
          $archive = Join-Path $PWD "build/$env:GIT_ASSET"
          $url = "https://github.com/git-for-windows/git/releases/download/$env:GIT_RELEASE/$env:GIT_ASSET"
          Invoke-WebRequest $url -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:GIT_SHA256) {
            throw 'Git package checksum mismatch'
          }
          if ($archive.EndsWith('.zip')) {
            Expand-Archive -LiteralPath $archive -DestinationPath $root
          } else {
            $process = Start-Process 7z -ArgumentList "x -y `"$archive`" -o`"$root`"" -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(60000)) {
              taskkill /PID $process.Id /T /F
              throw 'Git extraction timed out'
            }
            if ($process.ExitCode -ne 0) { throw 'Git extraction failed' }
          }
      - name: Test discovery, archives, and MSVC builds
        shell: pwsh
        env:
          TEST_OPTION: ${{ matrix.test_option }}
        run: |
          $tarball = (Get-Item build/packages/libusb-*.tar.bz2).FullName
          python tests/test_windows_version.py `
            --git-root 'build/tool profile/Atlassian/SourceTree/git_local' `
            $env:TEST_OPTION --msbuild (Get-Command msbuild).Source --tarball $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
